<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
<title id="title">Henil Patel — Computer Science at the University of Alberta</title>
<desc id="desc">Original vector artwork for Henil Patel's GitHub profile. Motion is disabled when reduced motion is preferred.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:5 13;animation:flow 18s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.cursor{animation:blink 1.15s steps(1) infinite}
.reveal{animation:typing 12s steps(25,end) infinite}
.type-cursor{transform:translateX(216px);animation:tracking 12s steps(25,end) infinite,blink 1.15s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-216}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes typing{0%,8%{width:0}36%,84%{width:216px}96%,100%{width:0}}
@keyframes tracking{0%,8%{transform:translateX(0)}36%,84%{transform:translateX(216px)}96%,100%{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{width:310px}.cursor,.type-cursor{opacity:0}}
</style>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#82a9c9" opacity=".14"/></pattern></defs>
<rect x=".5" y=".5" width="479" height="559" rx="18" fill="#0c1727" stroke="#2e455d"/>
<rect width="480" height="560" rx="18" fill="url(#dots)"/>
<path d="M30 1H163" stroke="#67e8dc" stroke-width="3"/>
<circle class="pulse" cx="34" cy="40" r="4" fill="#67e8dc"/>
<text class="mono" x="47" y="44" font-size="11" letter-spacing="1.8" fill="#9db5cc">HELLO, WORLD. I'M</text>
<text x="27" y="117" font-size="58" letter-spacing="-2.6" font-weight="700" fill="#f3f7fd">Henil Patel<tspan fill="#67e8dc">.</tspan></text>
<text x="30" y="155" font-size="20" fill="#c6d5e5">Computer Science</text>
<text x="30" y="183" font-size="20" fill="#c6d5e5">University of Alberta</text>
<text x="30" y="224" font-size="19" fill="#93a9c2">Turning curiosity into code.</text>
<text class="mono" x="30" y="533" font-size="11" fill="#7e94ae" letter-spacing="1.4">SOFTWARE / DATA / EXPLORATION</text>
<path class="flow" d="M328 529H450" stroke="#67e8dc" fill="none"/>
<g transform="translate(30 244)"><rect width="99" height="28" rx="14" fill="#142638" stroke="#294459"/><text class="mono" x="49.5" y="18" text-anchor="middle" fill="#c3d7e9" font-size="10" letter-spacing="1">BACKEND</text></g><g transform="translate(137 244)"><rect width="113" height="28" rx="14" fill="#142638" stroke="#294459"/><text class="mono" x="56.5" y="18" text-anchor="middle" fill="#c3d7e9" font-size="10" letter-spacing="1">DATABASES</text></g><g transform="translate(258 244)"><rect width="91" height="28" rx="14" fill="#142638" stroke="#294459"/><text class="mono" x="45.5" y="18" text-anchor="middle" fill="#c3d7e9" font-size="10" letter-spacing="1">AI / ML</text></g>
<g transform="translate(30 293)">
 <rect x="0" y="8" width="420" height="220" rx="15" fill="#02080f" opacity=".35"/>
 <rect width="420" height="220" rx="15" fill="#101e30" stroke="#31465d"/>
 <path d="M0 38H420" stroke="#2b3f54"/>
 <circle cx="19" cy="19" r="4" fill="#ff8175"/>
 <circle cx="35" cy="19" r="4" fill="#edc16f"/>
 <circle cx="51" cy="19" r="4" fill="#5bd5bb"/>
 <text class="mono" x="401" y="23" text-anchor="end" fill="#93a6bc" font-size="10">henil / workspace</text>
 <text class="mono" x="21" y="72" fill="#67e8dc" font-size="14">~ $ whoami</text>
 <text class="mono" x="21" y="97" fill="#e9f1fa" font-size="14">Computer Science student</text>
 <text class="mono" x="21" y="122" fill="#a3b4c9" font-size="14">Python · Java · SQL</text>
 <text class="mono" x="21" y="158" fill="#67e8dc" font-size="14">~ $ focus</text>
 <clipPath id="typeClip"><rect class="reveal" x="0" y="0" width="310" height="26"/></clipPath>
 <g transform="translate(21 173)" clip-path="url(#typeClip)">
  <text class="mono" y="14" fill="#f3f7fd" font-size="14">Building useful software.</text>
 </g>
 <rect class="type-cursor" x="21" y="175" width="7" height="15" rx="1" fill="#67e8dc"/>
</g></svg>