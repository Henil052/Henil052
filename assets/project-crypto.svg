<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" role="img" aria-labelledby="title desc">
<title id="title">ALGORITHMS &amp; CRYPTO</title>
<desc id="desc">Original vector artwork for Henil Patel's GitHub profile. Motion is disabled when reduced motion is preferred.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:5 13;animation:flow 18s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.cursor{animation:blink 1.15s steps(1) infinite}
.reveal{animation:typing 12s steps(25,end) infinite}
.type-cursor{transform:translateX(216px);animation:tracking 12s steps(25,end) infinite,blink 1.15s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-216}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes typing{0%,8%{width:0}36%,84%{width:216px}96%,100%{width:0}}
@keyframes tracking{0%,8%{transform:translateX(0)}36%,84%{transform:translateX(216px)}96%,100%{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.reveal{width:310px}.cursor,.type-cursor{opacity:0}}
</style><rect x=".5" y=".5" width="479" height="95" rx="10" fill="#101f31" stroke="#2b425b"/>
<text class="mono" x="22" y="31" font-size="10" letter-spacing="2" fill="#8ba3be">SELECTED WORK / 04</text>
<text class="mono" x="22" y="61" font-size="13" letter-spacing=".7" fill="#d0b5f5">ALGORITHMS &amp; CRYPTO</text>
